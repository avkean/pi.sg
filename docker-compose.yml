name: pi

services:
  web:
    build:
      context: .
    container_name: pi-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true

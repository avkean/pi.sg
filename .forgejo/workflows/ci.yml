name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: docker
    container:
      image: node:26.8.1-bookworm
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Check scalar mixed codec
        run: |
          PI_NEURAL_BACKEND=scalar npm run build
          node --test test/mixed-frame.test.mjs test/server-compressor.test.mjs
